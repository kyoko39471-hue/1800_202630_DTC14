<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Communication Help</title>

    <style>
        /* Mobile-first page layout */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #171717;
            background-color: #ffffff;
        }

        .app-page {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            border-left: 1px solid #eeeeee;
            border-right: 1px solid #eeeeee;
        }

        .page-header {
            padding: 38px 24px 24px;
            border-bottom: 2px solid #222222;
        }

        .page-header h1 {
            margin: 0;
            font-size: 32px;
            line-height: 1.2;
        }

        .page-content {
            flex: 1;
            padding: 34px 18px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }


        .category-card {
            min-width: 0;
            height: 210px;
            padding: 14px 10px;
            border: 2px solid #252525;
            border-radius: 14px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;

            text-decoration: none;
            color: inherit;
            background-color: white;
        }


        .category-card h2 {
            margin: 0;
            font-size: clamp(13px, 3.6vw, 18px);
            line-height: 1.3;
            text-align: center;
            overflow-wrap: anywhere;
        }



        .category-card img {
            width: 90%;
            height: 140px;
            object-fit: contain;
        }

        /* Move the images in the right column slightly right */
        .category-card:nth-child(even) img {
            transform: translateX(12px);
        }

        .category-card:hover,
        .category-card:focus-visible {
            background-color: #f3f3f3;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 13px 8px;
            border-top: 2px solid #222222;
        }

        .bottom-nav a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 52px;
            color: #202020;
            border-radius: 8px;
        }

        .bottom-nav a:hover,
        .bottom-nav a:focus-visible {
            background: #f0f0f0;
        }

        .bottom-nav svg {
            width: 36px;
            height: 36px;
        }

        @media (max-width: 350px) {
            .page-content {
                padding: 24px 12px;
            }

            .category-grid {
                gap: 10px;
            }

            .category-card {
                min-height: 150px;
            }
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 24px;
            border-bottom: 2px solid #222;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .logout-btn {
            padding: 8px 14px;
            background: white;
            color: #222;
            border: 1.5px solid #222;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .logout-btn:hover {
            background: #f2f2f2;
        }

        .logout-btn:focus-visible {
            outline: 2px solid #2563eb;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div class="app-page">
        <header class="page-header">
            <h1>Hello, <span id="name-goes-here">friend</span></h1>

            <button id="logoutBtn" class="logout-btn" type="button">
                Log out
            </button>
        </header>

        <main class="page-content">
            <div class="category-grid">
                <!-- Reuse the same detail page for all categories, like eachHike.html. -->
                <a class="category-card" href="eachCategory.html?category=accommodation">
                    <h2>Accommodation</h2>
                    <img src="/images/accommodation.jpg" alt="Hotel room">
                </a>

                <a class="category-card" href="eachCategory.html?category=restaurants">
                    <h2>Restaurants</h2>
                    <img src="/images/restaurants.jpg" alt="Restaurants">
                </a>

                <a class="category-card" href="eachCategory.html?category=greetings">
                    <h2>Greetings</h2>
                    <img src="/images/greetings.jpg" alt="Greetings">
                </a>

                <a class="category-card" href="eachCategory.html?category=emergency">
                    <h2>Emergency</h2>
                    <img src="/images/emergency.jpg" alt="Emergency">
                </a>
            </div>
        </main>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="main.html" aria-label="Home" aria-current="page">
                <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 18L20 5L35 18V35H24V24H16V35H5Z" />
                </svg>
            </a>
            <a href="savedphrases.html" aria-label="Saved Phrases">
                <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M10 5H30V36L20 28L10 36Z" />
                </svg>
            </a>
            <a href="profile.html" aria-label="Profile">
                <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <circle cx="20" cy="20" r="17" />
                    <circle cx="20" cy="15" r="6" />
                    <path d="M8 32C9 24 14 22 20 22S31 24 32 32" />
                </svg>
            </a>
        </nav>
    </div>

    <!-- Existing scripts from the working project. -->
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
