<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Express needs clearly | Communication Help</title>
    <script type="module" src="/src/navigation.js"></script>
</head>
<body class="communication-app">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="page container-fluid">
        <header class="page-header">
            <a class="back-link" href="index.html">‹ Back to Home</a>
            <h1>Express needs clearly</h1>
            <p class="subtitle">Write what you need help with.</p>
        </header>
        <main id="main-content" class="page-content">
            <div class="d-grid gap-4">
                <label class="d-block fw-semibold">Your request
                    <textarea class="form-control mt-2" rows="4" placeholder="For example: Could you please tell me where I can get some drinking water?"></textarea>
                </label>
                <section class="content-card" aria-label="Example request preview">
                    <p class="section-label">Example request</p>
                    <p class="request-text">Where can I get drinking water?</p>
                    <div class="d-flex align-items-center gap-3 mt-3">
                        <svg width="40" height="64" viewBox="0 0 40 64" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3h12v9l5 8v38a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V20l5-8Z"/><path d="M14 8h12M9 28h22M9 47h22"/></svg>
                        <span>Drinking water</span>
                    </div>
                </section>
                <p class="example-note">Sample wording and picture are shown for preview. Simplifying and updating the request will be added in a later step.</p>
            </div>
        </main>
        <app-navigation></app-navigation>
    </div>
</body>
</html>
