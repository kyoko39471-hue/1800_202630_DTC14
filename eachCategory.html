<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Category | Communication Help</title>
    </head>
    <body>
        <div class="app-page">
            <header class="app-header" data-app-header></header>
            <main class="app-content">
                <a class="back-link" href="main.html" data-app-back
                    ><span data-icon="back"></span>Back</a
                >
                <div class="heading">
                    <h1 id="category-title">Category</h1>
                </div>
                <p
                    id="pageStatus"
                    class="page-status"
                    role="status"
                    aria-live="polite"
                >
                    Loading phrases…
                </p>
                <button id="retryButton" class="action" hidden>Retry</button>
                <div id="phraseSearch" class="phrase-search" hidden>
                    <label for="searchPhrases">Search phrases</label>
                    <div class="phrase-search-field">
                        <input
                            id="searchPhrases"
                            type="search"
                            placeholder="e.g. menu or bill"
                            autocomplete="off"
                        />
                        <span data-icon="search" aria-hidden="true"></span>
                    </div>
                    <p id="phraseResults" class="muted" role="status"></p>
                </div>
                <div
                    id="phrases-go-here"
                    class="phrase-list"
                    aria-label="Travel phrases"
                ></div>
            </main>
            <nav
                class="bottom-nav"
                data-app-nav
                aria-label="Main navigation"
            ></nav>
        </div>
        <script type="module" src="/src/eachCategory.js"></script>
    </body>
</html>
