<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Saved Phrases | Communication Help</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #171717;
            background: white;
        }

        .app-page {
            max-width: 600px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: auto;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
        }

        .page-header {
            padding: 30px 22px;
            border-bottom: 2px solid #222;
        }

        .back-link {
            color: #222;
            text-decoration: none;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 0;
        }

        .page-content {
            flex: 1;
            padding: 24px 18px;
        }

        #phraseList {
            list-style: none;
            padding: 0;
        }

        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 2px solid #222;
            border-radius: 12px;
        }

        .saved-item span {
            overflow-wrap: anywhere;
        }

        .remove-btn {
            padding: 8px 12px;
            background: white;
            border: 1px solid #222;
            border-radius: 8px;
            cursor: pointer;
        }

        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            border-top: 2px solid #222;
        }

        .bottom-nav a {
            color: #222;
            font-size: 18px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="app-page">

        <header class="page-header">
            <a href="main.html" class="back-link">
                ← Back to Home
            </a>
            <h1>Saved Phrases</h1>
        </header>

        <main class="page-content">
            <p id="statusMessage">
                Loading saved phrases...
            </p>

            <ul id="phraseList"></ul>
        </main>

        <nav class="bottom-nav" aria-label="Main navigation">
            <a href="main.html">Home</a>
            <a href="savedphrases.html" aria-current="page">
                Saved
            </a>
            <a href="profile.html">Profile</a>
        </nav>

    </div>

    <script type="module" src="/src/savedphrases.js"></script>

</body>

</html>
