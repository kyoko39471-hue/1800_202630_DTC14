<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Saved Phrases</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        input,
        select,
        button {
            padding: 10px;
            margin: 5px 0;
        }

        input {
            width: 90%;
        }

        button {
            cursor: pointer;
        }

        li {
            margin: 10px 0;
        }
    </style>
</head>

<body>

    <h1>Saved Phrases</h1>

    <label for="user">Select Test User:</label>
    <select id="user">
        <option value="userA">User A</option>
        <option value="userB">User B</option>
    </select>

    <h2>Save a Phrase</h2>

    <input type="text" id="phraseInput" placeholder="Enter a phrase">

    <button onclick="savePhrase()">
        Save Phrase
    </button>

    <h2>My Saved Phrases</h2>

    <ul id="phraseList"></ul>

    <button onclick="testUserPhrases()">
        Test User-Specific Phrases
    </button>

    <p id="testResult"></p>

    <script>
        // Get selected test user
        function getCurrentUser() {
            return document.getElementById("user").value;
        }

        // Get phrases for a specific user
        function getSavedPhrases(userId) {
            const key = "savedPhrases_" + userId;

            return JSON.parse(
                localStorage.getItem(key) || "[]"
            );
        }

        // TASK 1: Save Phrase Functionality
        function savePhrase() {
            const userId = getCurrentUser();

            const input =
                document.getElementById("phraseInput");

            const phrase = input.value.trim();

            if (phrase === "") {
                alert("Please enter a phrase.");
                return;
            }

            const phrases = getSavedPhrases(userId);

            phrases.push(phrase);

            localStorage.setItem(
                "savedPhrases_" + userId,
                JSON.stringify(phrases)
            );

            input.value = "";

            displaySavedPhrases();

            alert("Phrase saved successfully!");
        }

        // TASK 2: Retrieve and Display Saved Phrases
        function displaySavedPhrases() {
            const userId = getCurrentUser();

            const phrases = getSavedPhrases(userId);

            const phraseList =
                document.getElementById("phraseList");

            phraseList.innerHTML = "";

            if (phrases.length === 0) {
                const item = document.createElement("li");
                item.textContent = "No saved phrases yet.";
                phraseList.appendChild(item);
                return;
            }

            phrases.forEach(function (phrase) {
                const item = document.createElement("li");
                item.textContent = phrase;
                phraseList.appendChild(item);
            });
        }

        // TASK 3: Test User-Specific Saved Phrases
        function testUserPhrases() {
            const testA = "__testUserA";
            const testB = "__testUserB";

            const keyA = "savedPhrases_" + testA;
            const keyB = "savedPhrases_" + testB;

            try {
                localStorage.setItem(
                    keyA,
                    JSON.stringify(["Phrase for A"])
                );

                localStorage.setItem(
                    keyB,
                    JSON.stringify(["Phrase for B"])
                );

                const userAPhrases = getSavedPhrases(testA);
                const userBPhrases = getSavedPhrases(testB);

                const passed =
                    userAPhrases.includes("Phrase for A") &&
                    !userAPhrases.includes("Phrase for B") &&
                    userBPhrases.includes("Phrase for B") &&
                    !userBPhrases.includes("Phrase for A");

                document.getElementById("testResult")
                    .textContent = passed
                        ? "PASS: Demo users have separate phrase lists."
                        : "FAIL: User phrase separation failed.";

            } finally {
                localStorage.removeItem(keyA);
                localStorage.removeItem(keyB);
            }
        }

        // Reload phrases when user changes
        document.getElementById("user")
            .addEventListener(
                "change",
                displaySavedPhrases
            );

        // Display saved phrases on page load
        displaySavedPhrases();
    </script>

</body>

</html>
