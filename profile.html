<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <title>My profile | Communication Help</title>
    </head>
    <body>
        <div class="app-page">
            <header class="app-header" data-app-header></header>
            <main class="app-content profile-content">
                <a class="back-link" href="main.html" data-app-back
                    ><span data-icon="back"></span>Back</a
                >
                <div class="heading">
                    <h1>My profile</h1>
                    <p>Your language and account.</p>
                </div>
                <p
                    id="pageStatus"
                    class="page-status"
                    role="status"
                    aria-live="polite"
                >
                    Loading your profile…
                </p>
                <button id="retryButton" class="action" hidden>Retry</button>
                <div class="profile-field">
                    <span class="field-label">Name</span>
                    <p id="profileName">—</p>
                </div>
                <div class="profile-field">
                    <span class="field-label">Email</span>
                    <p id="profileEmail">—</p>
                </div>
                <form id="profileForm" class="profile-language">
                    <label for="preferredLanguage">Destination language</label>
                    <div class="profile-language-select">
                        <select id="preferredLanguage" disabled>
                            <option value="en" hidden>Choose a language</option>
                        </select>
                        <span data-icon="chevron-down" aria-hidden="true"></span>
                    </div>
                    <button class="action action-primary" id="saveLanguage" type="submit" disabled>
                        Save language
                    </button>
                </form>
                <button
                    class="action action-secondary profile-edit"
                    id="editProfile"
                    type="button"
                    aria-controls="profileEditor"
                    aria-expanded="false"
                    disabled
                >
                    Edit profile
                </button>
                <form id="profileEditor" class="profile-editor" hidden>
                    <label for="displayName">Display name</label>
                    <input id="displayName" name="displayName" autocomplete="name" maxlength="40" required />
                    <div class="actions">
                        <button class="action action-primary" id="saveProfile" type="submit">Save changes</button>
                        <button class="action action-secondary" id="cancelEdit" type="button">Cancel</button>
                    </div>
                </form>
                <details class="profile-details">
                    <summary>How to use Communication Help</summary>
                    <ol>
                        <li>Choose a category on Home.</li>
                        <li>Read the English phrase and translation.</li>
                        <li>Tap the bookmark to keep a phrase in Saved.</li>
                    </ol>
                </details>
            </main>
            <nav
                class="bottom-nav"
                data-app-nav
                aria-label="Main navigation"
            ></nav>
        </div>
        <script type="module" src="/src/profile.js"></script>
    </body>
</html>
